name: Generar i publicar llistats

on:
  schedule:
    # Dues execucions diàries (05:00 i 17:00 UTC) perquè l'agendador de GitHub
    # de vegades endarrereix o salta fires en repos nous; així hi ha més marge.
    - cron: '0 5 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instal·lar dependències
        run: npm ci --no-audit --no-fund

      - name: Descarregar dades de la FCF
        run: npm run fetch

      - name: Build (Vite)
        run: npm run build
        env:
          BASE_PATH: /maxim-golejador-2627/

      - name: Guardar snapshot de dades (només si les dades reals han canviat)
        run: |
          # El camp `actualitzat` canvia a cada execució; es comparen les dades
          # sense aquest camp per evitar commits i runs en cadena infinits.
          if node -e '
            const fs = require("fs");
            const cp = require("child_process");
            const cur = JSON.parse(fs.readFileSync("src/data/scorers.json", "utf8"));
            const prev = JSON.parse(cp.execSync("git show HEAD:src/data/scorers.json", "utf8"));
            delete cur.actualitzat;
            delete prev.actualitzat;
            process.exit(JSON.stringify(cur) === JSON.stringify(prev) ? 0 : 1);
          '; then
            echo "Sense canvis a les dades; no es commiteja."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/scorers.json
            git commit -m "chore: actualitza snapshot de dades $(date -u +%F)"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Pujar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
