name: Generar i publicar llistats

on:
  schedule:
    # Cada dia a les 05:00 UTC (06:00 a l'hivern / 07:00 a l'estiu a Barcelona)
    - cron: '0 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instal·lar dependències
        run: npm ci --no-audit --no-fund

      - name: Descarregar dades de la FCF
        run: npm run fetch

      - name: Build (Vite)
        run: npm run build
        env:
          BASE_PATH: /maxim-golejador-2627/

      - name: Guardar snapshot de dades (si ha canviat)
        run: |
          if [ -n "$(git status --porcelain -- src/data/scorers.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/scorers.json
            git commit -m "chore: actualitza snapshot de dades $(date -u +%F)"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Pujar artefacte
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
