name: Diagnòstic FCF (temporal)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Proves de capçaleres X-Forwarded-For
        run: |
          set +e
          BASE="https://www.fcf.cat/api/competition/grupos?competicioId=58161949"
          CHROME_UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

          probe() {
            label="$1"; shift
            url="$BASE&nb=$RANDOM$RANDOM"
            code=$(curl -s -o /tmp/body.txt -w "%{http_code}" --max-time 20 -A "$CHROME_UA" -H "Accept: application/json" -H "Referer: https://www.fcf.cat/" "$@" "$url")
            first=$(head -c 60 /tmp/body.txt | tr -d '\n')
            echo "$label -> $code | $first"
          }

          probe "control (sense XFF)"
          probe "XFF=79.154.187.152 (IP residencial)" -H "X-Forwarded-For: 79.154.187.152"
          probe "XFF=84.120.0.1 (random)" -H "X-Forwarded-For: 84.120.0.1"
          probe "XFF=1.2.3.4 (random)" -H "X-Forwarded-For: 1.2.3.4"
          probe "XFF multi (meu, azure)" -H "X-Forwarded-For: 79.154.187.152, 20.190.2.1, 13.107.0.1"
          probe "Forwarded: for=meu" -H "Forwarded: for=79.154.187.152"
          probe "X-Real-IP: meu" -H "X-Real-IP: 79.154.187.152"
          probe "CF-Connecting-IP: meu" -H "CF-Connecting-IP: 79.154.187.152"
